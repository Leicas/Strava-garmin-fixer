{% if error %}
  <div class="alert alert-error text-sm"><span>{{ error }}</span></div>
{% elif not matches %}
  <div class="alert alert-warning text-sm"><span>No Garmin activities within ±2h of this exercise's start time.</span></div>
{% else %}
  <table class="table table-zebra table-sm">
    <thead>
      <tr><th>Started</th><th>Name</th><th>Garmin id</th><th>Type</th><th>Merge</th></tr>
    </thead>
    <tbody>
      {% for m in matches %}
      <tr>
        <td class="whitespace-nowrap">{{ m.start }}</td>
        <td>
          {{ m.name }}
          <a class="link link-hover opacity-50 ml-1"
             href="https://connect.garmin.com/modern/activity/{{ m.id }}"
             target="_blank" title="Open on Garmin Connect">↗</a>
        </td>
        <td class="font-mono">{{ m.id }}</td>
        <td class="text-xs opacity-70">{{ m.type }}</td>
        <td>
          <div class="join">
            <form hx-post="/garmin/activity/{{ m.id }}/merge"
                  hx-target="#garmin-match-jobs" hx-swap="afterbegin">
              <input type="hidden" name="external_id" value="{{ external_id }}">
              <input type="hidden" name="mode" value="dry_run">
              <button class="btn btn-ghost btn-xs join-item" type="submit"
                      title="Merge only — no delete/upload">Dry run</button>
            </form>
            <form hx-post="/garmin/activity/{{ m.id }}/merge"
                  hx-target="#garmin-match-jobs" hx-swap="afterbegin"
                  hx-confirm="Auto-replace deletes the original on Garmin Connect before uploading the merged FIT. Continue?">
              <input type="hidden" name="external_id" value="{{ external_id }}">
              <input type="hidden" name="mode" value="auto">
              <button class="btn btn-primary btn-xs join-item" type="submit">Auto</button>
            </form>
          </div>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <table class="table table-sm mt-2">
    <tbody id="garmin-match-jobs"></tbody>
  </table>
{% endif %}
